# Compiles the app and all extensions for the iOS Simulator on GitHub's macOS runners.
# No signing, no test server. Runs on every push and can be started by hand from the Actions tab.

name: Build GCC Talk

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKSPACE: GccTalk.xcworkspace
  SCHEME: GccTalk
  DESTINATION: generic/platform=iOS Simulator

jobs:
  build:
    name: Build (simulator)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
        submodules: true

    - name: Cache Pods
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('Podfile') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Setup CocoaPods
      uses: maxim-lobanov/setup-cocoapods@8e97e1e98e6ccf42564fdf5622c8feec74199377 # v1.4.0
      with:
        version: latest

    - name: pod install
      run: pod install

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
      with:
        xcode-version: '26.0.1'

    - name: Build
      run: |
        set -o pipefail && \
        xcodebuild build \
          -workspace "$WORKSPACE" \
          -scheme "$SCHEME" \
          -destination "$DESTINATION" \
          -derivedDataPath DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          | xcbeautify --quieter

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: xcodebuild-logs
        path: DerivedData/Logs/Build
        retention-days: 7
