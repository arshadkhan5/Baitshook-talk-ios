# Apache virtual host for the GCC Talk push proxy, for a server that already
# hosts Nextcloud on Apache (nc.baitshook.com).
#
#   sudo cp push.baitshook.com.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http ssl headers
#   sudo a2ensite push.baitshook.com
#   sudo systemctl reload apache2
#   sudo certbot --apache -d push.baitshook.com
#
# certbot rewrites this file to add the HTTPS listener and certificate paths.

<VirtualHost *:80>
    ServerName push.baitshook.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Nextcloud can send a few hundred notifications per request; keep the timeout generous.
    ProxyTimeout 60

    ErrorLog  ${APACHE_LOG_DIR}/push-proxy-error.log
    CustomLog ${APACHE_LOG_DIR}/push-proxy-access.log combined
</VirtualHost>
