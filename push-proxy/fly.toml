# Fly.io deployment for the GCC Talk push proxy.
#
#   fly launch --copy-config --no-deploy      # creates the app, pick a region near your users
#   fly volumes create pushdata --size 1      # persistent storage for devices.json
#   fly secrets set APNS_KEY_ID=AB12CD34EF APNS_TEAM_ID=9Z63VM6NS2 APNS_KEY_PEM="$(cat AuthKey.p8)"
#   fly deploy
#   fly status                                # shows the https://<app>.fly.dev hostname
#
# Then put that hostname into pushNotificationServer in GccTalk/Settings/NCAppBranding.m.

app = "gcc-talk-push"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APNS_BUNDLE_ID = "com.gcc.Talk"
  APNS_ENVIRONMENT = "production"
  APP_NAME = "GCC Talk"
  DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # pushes must be delivered immediately; never sleep
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[mounts]
  source = "pushdata"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
